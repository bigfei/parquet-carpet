plugins {
    id 'java'
    id 'java-library'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
}

// Custom configuration for JDBC drivers (separate from main dependencies)
configurations {
    jdbcDrivers
}

// JDBC driver versions
ext {
    duckdbVersion = '1.1.3'
    postgresqlVersion = '42.7.3'
    mysqlVersion = '8.0.33'
    sqliteVersion = '3.45.1.0'
    gaussdbVersion = '506.0.0.b058'
}

dependencies {
    implementation project(':carpet-record')

    // SLF4J logging API
    implementation "org.slf4j:slf4j-api:2.0.13"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.13"

    // AWS SDK for KMS encryption (optional dependency)
    implementation "software.amazon.awssdk:kms:2.20.0"
    implementation "software.amazon.awssdk:s3:2.20.0"

    // JDBC drivers - in separate configuration for optional bundling
    jdbcDrivers "org.duckdb:duckdb_jdbc:${duckdbVersion}"
    jdbcDrivers "org.postgresql:postgresql:${postgresqlVersion}"
    jdbcDrivers "com.mysql:mysql-connector-j:${mysqlVersion}"
    jdbcDrivers "org.xerial:sqlite-jdbc:${sqliteVersion}"
    jdbcDrivers "com.huaweicloud.gaussdb:gaussdbjdbc:${gaussdbVersion}"

    // Test dependencies - JDBC drivers declared explicitly
    testImplementation "org.duckdb:duckdb_jdbc:${duckdbVersion}"
    testImplementation "org.postgresql:postgresql:${postgresqlVersion}"
    testImplementation "com.mysql:mysql-connector-j:${mysqlVersion}"
    testImplementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    testImplementation "com.huaweicloud.gaussdb:gaussdbjdbc:${gaussdbVersion}"
    testImplementation "org.mongodb:bson:5.4.0"
    testImplementation "org.testcontainers:junit-jupiter:1.19.7"
    testImplementation "org.testcontainers:postgresql:1.19.7"
    testImplementation "org.testcontainers:mysql:1.19.7"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformLauncherVersion}"
}

test {
    useJUnitPlatform()

    // Increase heap size for large database exports
    minHeapSize = "1g"
    maxHeapSize = "4g"

    // Disable test result caching for development - always run tests
    outputs.upToDateWhen { false }

    // Show test results and container output in console
    testLogging {
        events "started", "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true

        // Show individual test progress
        afterTest { desc, result ->
            println "✅ Test ${desc.name}: ${result.resultType}"
        }
    }

    // Show summary after all tests
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\n" + "="*60
            println "🧪 TEST RESULTS SUMMARY"
            println "="*60
            println "📊 Tests run: ${result.testCount}"
            println "✅ Passed: ${result.successfulTestCount}"
            println "❌ Failed: ${result.failedTestCount}"
            println "⏭️  Skipped: ${result.skippedTestCount}"
            println "🎯 Result: ${result.resultType}"
            println "="*60
        }
    }
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'com/jerolba/carpet/jdbc/example/**'
            ])
        }))
    }
}

// Make jar task depend on sourcesJar
jar {
    dependsOn sourcesJar
}

// Create fat JAR WITHOUT JDBC drivers (lightweight ~42MB)
task fatJar(type: Jar) {
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':carpet-record:jar'
    
    manifest {
        attributes(
            'Main-Class': 'com.jerolba.carpet.jdbc.cli.DynamicJdbcExportCli',
            'Implementation-Version': project.version,
            'Multi-Release': 'true'
        )
    }
    
    // Include all runtime dependencies (excludes jdbcDrivers configuration)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Include compiled classes from this project
    with jar
}

// Create fat JAR WITH JDBC drivers (batteries-included ~131MB)
task fatJarWithDrivers(type: Jar) {
    archiveClassifier.set('full')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':carpet-record:jar'
    
    manifest {
        attributes(
            'Main-Class': 'com.jerolba.carpet.jdbc.cli.DynamicJdbcExportCli',
            'Implementation-Version': project.version,
            'Multi-Release': 'true'
        )
    }
    
    // Include all runtime dependencies
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Include JDBC drivers
    from {
        configurations.jdbcDrivers.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    // Include compiled classes from this project
    with jar
}

// Make build task create both fat JARs
build {
    dependsOn fatJar, fatJarWithDrivers
}

// Bundle export-gaussdb assets and fat JAR for server deployment
task bundleExportGaussdb(type: Zip) {
    group = "distribution"
    description = "Bundle export-gaussdb scripts, config, certs, and fat JAR for deployment."
    dependsOn fatJarWithDrivers

    archiveBaseName.set("export-gaussdb-bundle")
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(file("$buildDir/distributions"))

    from("$projectDir/scripts/export-gaussdb") {
        exclude "exports/**"
    }
    from("$buildDir/libs") {
        include "carpet-jdbc-${project.version}-full.jar"
    }
}
