# AWS KMS Configuration for Testing
#
# Copy this file to test.properties and configure with your actual KMS key.
# The test.properties file is in .gitignore to keep credentials safe.
#
# To run KMS encryption tests, you need:
# 1. An AWS KMS key with permissions: kms:GenerateDataKey and kms:Decrypt
# 2. AWS credentials configured (environment variables, ~/.aws/credentials, or IAM role)
# 3. This properties file configured with your KMS key ID

# KMS Key ID (required)
# Format options:
#   - Key ID:    12345678-1234-1234-1234-123456789012
#   - Key ARN:   arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
#   - Alias:     alias/my-encryption-key
#   - Alias ARN: arn:aws:kms:us-east-1:123456789012:alias/my-encryption-key
#
# Example:
aws.kms.keyId=arn:aws:kms:ap-southeast-1:431312751623:key/e6df0452-a104-4bc2-ae99-385abd703578

# AWS Region (optional, defaults to us-east-1)
aws.kms.region=ap-southeast-1

# AWS Profile (optional, uses default credential chain if not set)
# Specify a profile from ~/.aws/credentials
aws.profile=uat2

# ========================================
# Setup Instructions
# ========================================
#
# 1. Create a KMS key in AWS Console or CLI:
#
#    aws kms create-key \
#      --description "Parquet encryption test key" \
#      --key-usage ENCRYPT_DECRYPT
#
# 2. Grant your IAM user/role the necessary permissions:
#
#    {
#      "Version": "2012-10-17",
#      "Statement": [
#        {
#          "Effect": "Allow",
#          "Action": [
#            "kms:GenerateDataKey",
#            "kms:Decrypt"
#          ],
#          "Resource": "arn:aws:kms:us-east-1:123456789012:key/*"
#        }
#      ]
#    }
#
# 3. Configure AWS credentials (one of these options):
#
#    Option A: Environment variables
#      export AWS_ACCESS_KEY_ID=your-access-key
#      export AWS_SECRET_ACCESS_KEY=your-secret-key
#      export AWS_REGION=us-east-1
#
#    Option B: AWS credentials file (~/.aws/credentials)
#      [default]
#      aws_access_key_id = your-access-key
#      aws_secret_access_key = your-secret-key
#
#    Option C: IAM role (if running on EC2/ECS/Lambda)
#      No additional configuration needed
#
# 4. Copy this file to test.properties and set your KMS key ID:
#
#    cp test.properties.sample test.properties
#    # Edit test.properties with your key ID
#
# 5. Run tests:
#
#    ./gradlew :carpet-jdbc:test --tests KmsEncryptionTest
#
# Test output files are saved to: carpet-jdbc/encrypted/
# This directory is in .gitignore and contains:
#   - *.parquet files (encrypted data)
#   - *.parquet.metadata files (encryption metadata with encrypted DEK)
#   - README.md (documentation of test outputs)

